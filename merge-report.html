function countByType(type) {
  return type === "all" ? FILES.length : FILES.filter(f => f.type === type).length;
}

function renderOverview() {
  document.getElementById("overview").textContent = OVERVIEW;
}

function renderStats() {
  const types = [
    { key: "new", label: "新增文件", color: "var(--green)" },
    { key: "mod", label: "修改文件", color: "var(--orange)" },
    { key: "del", label: "删除文件", color: "var(--red)" },
    { key: "mig", label: "迁移文件", color: "var(--blue)" },
    { key: "doc", label: "文档/规格", color: "var(--purple)" },
  ];
  const el = document.getElementById("stats");
  el.innerHTML = types.map(t => `
    <div class="stat-card">
      <div class="stat-num" style="color:${t.color}">${countByType(t.key)}</div>
      <div class="stat-label">${t.label}</div>
    </div>`).join("");
}

function renderFilters() {
  const filters = [
    { key: "all", label: "全部" },
    { key: "new", label: "新增" },
    { key: "mod", label: "修改" },
    { key: "del", label: "删除" },
    { key: "mig", label: "迁移" },
    { key: "doc", label: "文档" },
  ];
  const el = document.getElementById("filters");
  el.innerHTML = filters.map(f => `
    <button class="filter-btn ${f.key === activeFilter ? "active" : ""}" data-type="${f.key}">
      ${f.label}<span class="count">${countByType(f.key)}</span>
    </button>`).join("");
  el.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      activeFilter = btn.dataset.type;
      renderFilters();
      applyFilters();
    });
  });
}

function renderFileList() {
  const el = document.getElementById("fileList");
  el.innerHTML = FILES.map((f, i) => {
    const m = TYPE_META[f.type];
    const changesHtml = f.changes.map(c => `<div class="change-item">${c}</div>`).join("");
    return `
      <div class="file-row" data-index="${i}" data-type="${f.type}" data-path="${f.path.toLowerCase()}" data-text="${f.changes.join(" ").toLowerCase()}">
        <div class="file-head" onclick="toggleRow(${i})">
          <span class="badge ${m.cls}">${m.label}</span>
          <span class="file-path">${f.path}</span>
          <span class="chevron">▶</span>
        </div>
        <div class="file-body"><div class="changes">${changesHtml}</div></div>
      </div>`;
  }).join("");
  document.getElementById("totalCount").textContent = FILES.length;
}

function toggleRow(i) {
  const row = document.querySelector(`.file-row[data-index="${i}"]`);
  row.classList.toggle("open");
}

function applyFilters() {
  const term = searchTerm.trim().toLowerCase();
  let visible = 0;
  document.querySelectorAll(".file-row").forEach(row => {
    const typeOk = activeFilter === "all" || row.dataset.type === activeFilter;
    const textOk = !term || row.dataset.path.includes(term) || row.dataset.text.includes(term);
    if (typeOk && textOk) {
      row.classList.remove("hidden");
      visible++;
    } else {
      row.classList.add("hidden");
    }
  });
  document.getElementById("totalCount").textContent = visible;
}

document.getElementById("search").addEventListener("input", e => {
  searchTerm = e.target.value;
  applyFilters();
});

renderOverview();
renderStats();
renderFilters();
renderFileList();
</script>
</body>
</html>
