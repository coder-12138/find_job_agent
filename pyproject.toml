[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "job-application-agent"
version = "0.1.0"
description = "自动校招简历投递Agent"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.40.0",
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pypdf>=5.0.0",
    "cryptography>=49.0.0",
    "pymupdf>=1.26.0",
    "rapidocr-onnxruntime>=1.4.0",
    "pillow>=11.0.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "deepagents>=0.1.0",
    "python-dotenv>=1.0.0",
    "plyer>=2.1.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "httpx>=0.27.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"job_application_agent_langchain.infrastructure.database.sql" = ["*.sql"]
"job_application_agent_langchain.web" = [
    "static/*", "static/css/*", "static/js/*",
    "task_static/*", "task_static/assets/*"
]

[tool.pytest.ini_options]
testpaths = ["tests_langchain"]
norecursedirs = [".git", ".venv", "pytest-of-*", "tmp*"]
